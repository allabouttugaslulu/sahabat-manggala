<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sahabat Manggala</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<section class="services">
  <h2 class="section-title">Layanan Kami</h2>

  <div class="service-grid">

    <!-- CARD 1 -->
    <div class="service-card fade-up">
      <div class="icon">🤍</div>
      <h3>Curhat Anonim</h3>

      <button class="btn-outline" onclick="openModal('curhat')">
        Cara Mendaftar
      </button>

      <a href="#" class="btn-primary">Pendaftaran</a>
    </div>

    <!-- CARD 2 -->
    <div class="service-card fade-up">
      <div class="icon">🤝</div>
      <h3>Peer Counselor</h3>

      <button class="btn-outline" onclick="openModal('peer')">
        Cara Mendaftar
      </button>

      <a href="#" class="btn-primary">Pendaftaran</a>
    </div>

    <!-- CARD 3 -->
    <div class="service-card fade-up">
      <div class="icon">🧠</div>
      <h3>Konseling Profesional</h3>

      <button class="btn-outline" onclick="openModal('pro')">
        Cara Mendaftar
      </button>

      <a href="#" class="btn-primary">Pendaftaran</a>
    </div>

  </div>
</section>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal()">&times;</span>
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
